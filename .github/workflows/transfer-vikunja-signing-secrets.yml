name: One-time Vikunja signing secret transfer

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: vikunja-signing-secret-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'CoultonF/blink' && github.ref == 'refs/heads/raw' && github.actor == 'CoultonF'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy only missing signing secrets to homelab
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          target='CoultonF/homelab'
          for name in GH_PAT MATCH_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required source secret $name is missing"
              exit 1
            fi
          done
          existing=$(gh secret list --repo "$target" --json name --jq '.[].name')
          gh api "repos/$target/actions/secrets/public-key" --silent
          for name in GH_PAT MATCH_PASSWORD; do
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "Keeping existing $name"
              continue
            fi
            printf '%s' "${!name}" | gh secret set "$name" --repo "$target"
            echo "Configured $name"
          done
          gh secret list --repo "$target" --json name --jq '.[].name'
